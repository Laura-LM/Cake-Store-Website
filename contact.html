<!DOCTYPE html>
<html lang="en">
<head>
    <title>Bakery Website</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/57f2681792.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <header id="header">
        <a href="index.html" class="logo"><img src="images/logo.png" alt="logo"></a>
        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="cakes.html">Cakes</a>
            <a href="contact.html">Contact Us</a>
        </nav>
        <div class="icons">
            <div class="menu-icon"><i class="fa-solid fa-bars"></i></div>
        </div>
    </header>
    <script src="script.js"></script>

    <section class="contact">
        <h3>Contact Us</h3>
    </section>

    <section class="cakes">
        <div class="section_cakes" id="cakes">
            <h3 class="title">Contact <span> Us</span></h3>
        </div>

        <div class="contact-form">
            <form id="contactForm" action="?" onsubmit="return validateForm()"> 
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                    <span id="nameError" class="error-message">Name is required.</span>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone" pattern="^\d{10}$" required>
                    <span id="phoneError" class="error-message">Please enter a valid 10-digit phone number.</span>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                    <span id="emailError" class="error-message">Please enter a valid email address.</span>
                </div>
                <div class="form-group">
                    <label for="comments">Comments:</label>
                    <textarea id="comments" name="comments" rows="4" required></textarea>
                </div>
                <div class="form-group">
                    <button type="submit">Submit</button>
                    <button type="reset">Reset</button>
                </div>
            </form>
        </div>
    </section> 
</body>
</html>
